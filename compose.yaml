services:
  postgres:
    image: postgres:15-alpine
    container_name: aguafix_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_contraseña_de_postgres
      POSTGRES_DB: aguafix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: